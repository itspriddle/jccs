[package]
name = "jccs"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Josh's Claude Code Statusline"
license = "MIT"
repository = "https://github.com/itspriddle/jccs"
publish = false

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
